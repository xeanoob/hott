<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 400 100" width="400" height="100">
  <!-- Left D-ring -->
  <path d="M 120 30 C 50 30, 50 110, 120 110 Z" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Right D-ring -->
  <path d="M 280 30 C 350 30, 350 110, 280 110 Z" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Connections (tapered) -->
  <polygon points="120,60 180,68 180,72 120,80" fill="currentColor" />
  <polygon points="280,60 220,68 220,72 280,80" fill="currentColor" />

  <!-- Middle H -->
  <!-- Left vertical bar of H -->
  <rect x="175" y="40" width="10" height="60" fill="currentColor" />
  <!-- Left vertical bar top/bottom serifs -->
  <rect x="165" y="38" width="30" height="4" fill="currentColor" />
  <rect x="165" y="98" width="30" height="4" fill="currentColor" />

  <!-- Right vertical bar of H -->
  <rect x="215" y="40" width="10" height="60" fill="currentColor" />
  <!-- Right vertical bar top/bottom serifs -->
  <rect x="205" y="38" width="30" height="4" fill="currentColor" />
  <rect x="205" y="98" width="30" height="4" fill="currentColor" />

  <!-- Horizontal bar of H -->
  <rect x="185" y="68" width="30" height="4" fill="currentColor" />
</svg>
